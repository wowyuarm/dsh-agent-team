packages:
  - packages/*

# pnpm 11: allowBuilds replaces onlyBuiltDependencies (map of package -> boolean).
# strictDepBuilds defaults to true, so an unapproved build script fails install.
allowBuilds:
  esbuild: true

# Dev resolution goes through tsconfig paths against the sibling deepseek-harness
# checkout; stale registry peer versions must not block install. Published
# bundles resolve peers from the registry at the end-user install site.
autoInstallPeers: false

# pnpm admits a version younger than its minimum release age only when it is
# listed here, and maintains the list itself while installing. The certified
# cut pins this exact version in package.json, so the entry grants nothing
# beyond what the manifest already requires; removing it fails CI's frozen
# install with ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION until the version ages out.
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-storage-sqlite@0.1.5-rc.1'
